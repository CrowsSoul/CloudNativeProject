server:
  port: 9999
spring:
  application:
    name: @artifactId@
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: order-client
          uri: lb://order-client
          filters:
            - StripPrefix=1
          predicates:
            - Path=/order/**
        - id: employee-client
          uri: lb://employee-client
          filters:
            - StripPrefix=1
          predicates:
            - Path=/employee/**
        - id: user-client
          uri: lb://user-client
          filters:
            - StripPrefix=1
          predicates:
            - Path=/user/**
eureka:
  instance:
    prefer-ip-address: true
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-service.stockmgr.svc.cluster.local:8888/eureka